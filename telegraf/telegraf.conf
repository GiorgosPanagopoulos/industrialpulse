[global_tags]
  project = "industrialpulse"

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  omit_hostname = false

# ---------------------------------------------------------------------------
# INPUT: MQTT broker
# ---------------------------------------------------------------------------
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics   = ["machines/+/telemetry"]
  qos      = 1
  client_id = "telegraf-industrialpulse"
  connection_timeout = "30s"

  name_override = "machine_telemetry"
  data_format   = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    # machine_id → tag
    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "machine_id"
      type = "string"

    # status → string field
    [[inputs.mqtt_consumer.json_v2.field]]
      path = "status"
      type = "string"

    # All sensor values inside the sensors object → numeric fields
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "sensors"

# ---------------------------------------------------------------------------
# OUTPUT: InfluxDB 2.x
# ---------------------------------------------------------------------------
[[outputs.influxdb_v2]]
  urls         = ["http://influxdb:8086"]
  token        = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket       = "${INFLUXDB_BUCKET}"
